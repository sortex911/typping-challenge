<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <!-- Auth Screen -->
    <section id="auth-screen" class="screen active">
      <div class="glass-card">
        <h1>Typing Challenge</h1>
        <p>Test your speed. Compete with others.</p>
        <form id="login-form">
          <h2 id="auth-title" style="margin-bottom: 20px; font-size: 1.5rem;">Register Player</h2>
          <input type="text" id="username" placeholder="Choose a Username" required autocomplete="off" />
          <div class="input-group hidden">
            <input type="password" id="password" placeholder="Admin Password" autocomplete="off" />
          </div>
          <button type="submit" id="auth-submit" class="btn primary">Start Challenge</button>
          <p style="margin-top: 15px; cursor: pointer; color: var(--text-secondary); font-size: 0.9rem;"
            id="toggle-admin">Admin Access</p>
        </form>
      </div>
    </section>

    <!-- Admin Screen -->
    <section id="admin-screen" class="screen hidden">
      <div class="glass-card" style="max-width: 800px;">
        <div class="header-row" style="display:flex; justify-content:space-between; margin-bottom:20px;">
          <h2>Admin Control Panel</h2>
          <button id="admin-logout" class="btn text">Logout</button>
        </div>

        <div class="admin-section" style="text-align:left; margin-bottom:30px;">
          <h3>User Management</h3>
          <ul id="user-list"
            style="list-style:none; max-height:200px; overflow-y:auto; border:1px solid var(--glass-border); padding:10px; border-radius:10px; margin-top:10px;">
            <!-- Users injected here -->
          </ul>
        </div>

        <div class="admin-section" style="text-align:left; margin-bottom:30px;">
          <h3>Game Settings</h3>
          <label style="display:block; margin: 10px 0;">Timer Duration (seconds):</label>
          <input type="number" id="timer-setting" value="60" style="max-width: 100px;">
        </div>

        <div class="admin-section" style="text-align:left;">
          <h3>Paragraph Management</h3>
          <div style="display:flex; gap:10px; margin-bottom:10px;">
            <textarea id="new-paragraph" placeholder="Enter new paragraph text..."
              style="width:100%; height:80px; padding:10px; border-radius:10px; background:rgba(0,0,0,0.2); border:1px solid var(--glass-border); color:white;"></textarea>
          </div>
          <button id="add-paragraph-btn" class="btn primary" style="margin-bottom:20px;">Add Paragraph</button>

          <h4>Current Paragraphs</h4>
          <ul id="paragraph-list"
            style="list-style:none; max-height:200px; overflow-y:auto; border:1px solid var(--glass-border); padding:10px; border-radius:10px;">
            <!-- Paragraphs injected here -->
          </ul>
        </div>

        <button id="save-config-btn" class="btn success"
          style="margin-top:20px; background: var(--success-color); color: white;">Save Changes</button>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen hidden">
      <header class="game-header">
        <div class="user-info">Player: <span id="current-player"></span></div>
        <div class="stats">
          <div class="stat-item">Time: <span id="timer">60</span>s</div>
          <div class="stat-item">Score: <span id="score">0</span></div>
        </div>
        <button id="logout-btn" class="btn text">Exit</button>
      </header>

      <div class="game-area glass-card">
        <div id="text-display" class="text-display"></div>
        <div id="game-message" class="game-message hidden"></div>
      </div>

      <div class="controls">
        <button id="view-leaderboard-btn" class="btn secondary">View Leaderboard</button>
        <button id="restart-btn" class="btn primary hidden">Try Again</button>
      </div>
    </section>

    <!-- Leaderboard Screen -->
    <section id="leaderboard-screen" class="screen hidden">
      <div class="glass-card">
        <h2>Leaderboard</h2>
        <ul id="leaderboard-list" class="leaderboard-list">
          <!-- Items injected here -->
        </ul>
        <button id="back-to-game" class="btn secondary">Back to Game</button>
      </div>
    </section>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
